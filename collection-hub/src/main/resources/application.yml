server:
  port: 8080

spring:
  application:
    name: collection-hub
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/collection_hub}
    username: ${SPRING_DATASOURCE_USERNAME:hub_user}
    password: ${SPRING_DATASOURCE_PASSWORD:hub_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

fineract:
  base-url: ${FINERACT_BASE_URL:https://localhost:8443/fineract-provider/api/v1}
  tenant-id: ${FINERACT_TENANT_ID:default}
  username: ${FINERACT_USERNAME:mifos}
  password: ${FINERACT_PASSWORD:password}
  insecure-ssl: ${FINERACT_INSECURE_SSL:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
