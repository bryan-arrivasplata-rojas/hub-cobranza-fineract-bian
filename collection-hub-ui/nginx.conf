server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /fineract-api/ {
        proxy_pass https://fineract-server:8443/fineract-provider/api/v1/;
        proxy_ssl_verify off;
        proxy_set_header Authorization "Basic bWlmb3M6cGFzc3dvcmQ=";
        proxy_set_header Fineract-Platform-TenantId "default";
        proxy_set_header Host $host;
    }
}
